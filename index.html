<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaAds & CRM - Gestão Integrada com Gemini AI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tipografia Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-custom-dark { background-color: #02153D; }
    .bg-custom-purple { background-color: #4B227A; }
    .bg-custom-turq { background-color: #0197AF; }
    .text-custom-mint { color: #00EED0; }
    .border-custom-mint { border-color: #00EED0; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_CAMPAIGNS = [
      { id: '1', name: 'Campanha Lead Qualificado - Q4', type: 'Leads', budget: 5000, spent: 3500, results: 280, costPerResult: 12.50, reach: 64000, status: 'Ativa' },
      { id: '2', name: 'Lançamento Produto SaaS', type: 'Vendas de Produtos', budget: 8000, spent: 5056, results: 140, costPerResult: 36.11, reach: 96100, status: 'Ativa' }
    ];

    const INITIAL_LEADS = [
      { id: '101', name: 'Tech Solutions LTDA', status: 'Lead Gerado', campaignId: '1', dealType: 'Serviço', dealValue: 0, phone: '(31) 99887-1122', email: 'contato@techsolutions.com' },
      { id: '102', name: 'Grupo Inovação', status: 'Qualificação', campaignId: '1', dealType: 'Serviço', dealValue: 0, phone: '(31) 98765-4321', email: 'vendas@grupoinovacao.com' },
      { id: '103', name: 'Clínica Saúde Express', status: 'Proposta', campaignId: '2', dealType: 'Produto', dealValue: 0, phone: '(31) 97654-3210', email: 'adm@saudeexpress.com' },
      { id: '104', name: 'EducaDigital Corp', status: 'Fechamento', campaignId: '2', dealType: 'Produto', dealValue: 3200, phone: '(31) 96543-2109', email: 'diretoria@educadigital.com' }
    ];

    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [activeTab, setActiveTab] = useState('overview');
      const [campaigns, setCampaigns] = useState(INITIAL_CAMPAIGNS);
      const [leads, setLeads] = useState(INITIAL_LEADS);

      // Modais
      const [editingCampaign, setEditingCampaign] = useState(null);
      const [inFlightCampaign, setInFlightCampaign] = useState(null);
      const [editingLead, setEditingLead] = useState(null);
      const [closingLeadModal, setClosingLeadModal] = useState(null);

      // Forms
      const [newCampaign, setNewCampaign] = useState({ name: '', type: 'Leads', budget: '', spent: '', results: '', reach: '' });
      const [newLead, setNewLead] = useState({ name: '', campaignId: '1', dealType: 'Serviço', phone: '', email: '' });
      const [closingData, setClosingData] = useState({ dealType: 'Produto', dealValue: '' });

      // Recálculos de KPIs Globais em Tempo Real
      const totalBudgetSpent = campaigns.reduce((acc, c) => acc + Number(c.spent || 0), 0);
      const totalReach = campaigns.reduce((acc, c) => acc + Number(c.reach || 0), 0);
      const totalResults = campaigns.reduce((acc, c) => acc + Number(c.results || 0), 0);
      const avgCostPerResult = totalResults > 0 ? (totalBudgetSpent / totalResults) : 0;
      
      const closedLeads = leads.filter(l => l.status === 'Fechamento');
      const crmConversionRate = leads.length > 0 ? ((closedLeads.length / leads.length) * 100) : 0;
      const totalRevenue = closedLeads.reduce((acc, l) => acc + Number(l.dealValue || 0), 0);
      const netProfit = totalRevenue - totalBudgetSpent;
      const roasPerReal = totalBudgetSpent > 0 ? (totalRevenue / totalBudgetSpent) : 0;

      // Handlers de Campanhas
      const handleAddCampaign = (e) => {
        e.preventDefault();
        if (!newCampaign.name || !newCampaign.budget) return;
        const spentVal = Number(newCampaign.spent || 0);
        const resVal = Number(newCampaign.results || 0);
        const cpr = resVal > 0 ? spentVal / resVal : 0;
        
        const item = {
          id: Date.now().toString(),
          name: newCampaign.name,
          type: newCampaign.type,
          budget: Number(newCampaign.budget),
          spent: spentVal,
          results: resVal,
          costPerResult: cpr,
          reach: Number(newCampaign.reach || 0),
          status: 'Ativa'
        };
        setCampaigns([...campaigns, item]);
        setNewCampaign({ name: '', type: 'Leads', budget: '', spent: '', results: '', reach: '' });
      };

      const handleUpdateInFlight = (e) => {
        e.preventDefault();
        if (!inFlightCampaign) return;
        setCampaigns(campaigns.map(c => {
          if (c.id === inFlightCampaign.id) {
            const spent = Number(inFlightCampaign.spent || 0);
            const results = Number(inFlightCampaign.results || 0);
            const cpr = results > 0 ? spent / results : 0;
            return { ...c, spent, results, reach: Number(inFlightCampaign.reach || 0), costPerResult: cpr };
          }
          return c;
        }));
        setInFlightCampaign(null);
      };

      const handleSaveEditCampaign = (e) => {
        e.preventDefault();
        if (!editingCampaign) return;
        setCampaigns(campaigns.map(c => c.id === editingCampaign.id ? editingCampaign : c));
        setEditingCampaign(null);
      };

      const handleDeleteCampaign = (id) => {
        if (confirm('Deseja realmente excluir esta campanha?')) {
          setCampaigns(campaigns.filter(c => c.id !== id));
        }
      };

      // Handlers de CRM Kanban
      const handleAddLead = (e) => {
        e.preventDefault();
        if (!newLead.name) return;
        const item = {
          id: Date.now().toString(),
          name: newLead.name,
          status: 'Lead Gerado',
          campaignId: newLead.campaignId,
          dealType: newLead.dealType,
          dealValue: 0,
          phone: newLead.phone,
          email: newLead.email
        };
        setLeads([...leads, item]);
        setNewLead({ name: '', campaignId: '1', dealType: 'Serviço', phone: '', email: '' });
      };

      const handleMoveLead = (leadId, targetStatus) => {
        const lead = leads.find(l => l.id === leadId);
        if (!lead) return;
        if (targetStatus === 'Fechamento' && lead.status !== 'Fechamento') {
          setClosingLeadModal(lead);
          setClosingData({ dealType: lead.dealType || 'Produto', dealValue: lead.dealValue || '' });
        } else {
          setLeads(leads.map(l => l.id === leadId ? { ...l, status: targetStatus } : l));
        }
      };

      const handleConfirmClosing = (e) => {
        e.preventDefault();
        if (!closingLeadModal) return;
        setLeads(leads.map(l => l.id === closingLeadModal.id ? {
          ...l,
          status: 'Fechamento',
          dealType: closingData.dealType,
          dealValue: Number(closingData.dealValue || 0)
        } : l));
        setClosingLeadModal(null);
      };

      const handleDeleteLead = (id) => {
        if (confirm('Deseja excluir este lead?')) {
          setLeads(leads.filter(l => l.id !== id));
        }
      };

      const handleSaveEditLead = (e) => {
        e.preventDefault();
        if (!editingLead) return;
        setLeads(leads.map(l => l.id === editingLead.id ? editingLead : l));
        setEditingLead(null);
      };

      return (
        <div className={`flex min-h-screen ${darkMode ? 'bg-gray-950 text-white' : 'bg-gray-100 text-gray-900'}`}>
          {/* SIDEBAR */}
          <aside className="w-64 bg-custom-dark p-6 flex flex-col justify-between border-r border-gray-800">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#0197AF] to-[#00EED0] flex items-center justify-center font-bold text-black text-xl">
                  M
                </div>
                <div>
                  <h1 className="font-bold text-lg text-white leading-tight">MetaAds & CRM</h1>
                  <p className="text-xs text-custom-mint">Gestão Integrada</p>
                </div>
              </div>

              <nav className="space-y-2">
                {[
                  { id: 'overview', label: 'Visão Geral', icon: '📊' },
                  { id: 'campaigns', label: 'Campanhas', icon: '📢', badge: campaigns.length },
                  { id: 'crm', label: 'CRM Kanban', icon: '📋', badge: leads.length },
                  { id: 'insights', label: 'Gemini AI Insights', icon: '✨' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center justify-between px-4 py-3 rounded-lg font-medium text-sm transition-all ${
                      activeTab === tab.id ? 'bg-[#0197AF] text-white shadow-lg' : 'text-gray-400 hover:bg-gray-800/50 hover:text-white'
                    }`}
                  >
                    <span className="flex items-center gap-3">
                      <span>{tab.icon}</span>
                      {tab.label}
                    </span>
                    {tab.badge !== undefined && (
                      <span className="text-xs bg-gray-900 px-2 py-0.5 rounded-full text-custom-mint font-semibold">
                        {tab.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <button
              onClick={() => setDarkMode(!darkMode)}
              className="flex items-center justify-between px-4 py-3 rounded-lg border border-gray-700 hover:bg-gray-800 text-sm font-medium transition"
            >
              <span>{darkMode ? '🌙 Modo Escuro' : '☀️ Modo Claro'}</span>
              <span className="text-xs text-custom-mint font-bold">{darkMode ? 'ON' : 'OFF'}</span>
            </button>
          </aside>

          {/* ÁREA PRINCIPAL */}
          <main className="flex-1 p-8 overflow-y-auto">
            {/* TOP BAR - 6 KPIS FIXOS */}
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
              <div className="bg-custom-dark border border-gray-800 p-4 rounded-xl">
                <p className="text-xs text-gray-400 font-medium">Orçamento Consumido</p>
                <p className="text-xl font-bold text-white mt-1">R$ {totalBudgetSpent.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
              </div>

              <div className="bg-custom-dark border border-gray-800 p-4 rounded-xl">
                <p className="text-xs text-gray-400 font-medium">Alcance Total</p>
                <p className="text-xl font-bold text-white mt-1">{totalReach.toLocaleString('pt-BR')}</p>
              </div>

              <div className="bg-custom-dark border border-gray-800 p-4 rounded-xl">
                <p className="text-xs text-gray-400 font-medium">Custo / Resultado</p>
                <p className="text-xl font-bold text-custom-mint mt-1">R$ {avgCostPerResult.toFixed(2)}</p>
              </div>

              <div className="bg-custom-dark border border-gray-800 p-4 rounded-xl">
                <p className="text-xs text-gray-400 font-medium">Conversão CRM</p>
                <p className="text-xl font-bold text-white mt-1">{crmConversionRate.toFixed(1)}%</p>
              </div>

              <div className="bg-custom-dark border border-gray-800 p-4 rounded-xl">
                <p className="text-xs text-gray-400 font-medium">Receita Total</p>
                <p className="text-xl font-bold text-white mt-1">R$ {totalRevenue.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
              </div>

              <div className={`p-4 rounded-xl border ${netProfit >= 0 ? 'bg-custom-dark border-[#00EED0]' : 'bg-red-950/40 border-red-500'}`}>
                <p className="text-xs text-gray-400 font-medium">Lucro Líquido / ROAS</p>
                <p className="text-lg font-bold text-custom-mint mt-1">R$ {netProfit.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                <p className="text-xs font-semibold text-gray-300">R$ {roasPerReal.toFixed(2)} por R$ 1,00</p>
              </div>
            </div>

            {/* CONTEÚDO DAS ABAS */}
            {activeTab === 'overview' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-bold">Visão Geral do Ecossistema</h2>
                <div className="bg-custom-dark border border-gray-800 rounded-xl p-6">
                  <h3 className="text-lg font-bold mb-4 text-custom-mint">Campanhas Ativas & Métricas Parciais</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="border-b border-gray-800 text-gray-400">
                        <tr>
                          <th className="py-3 px-4">Nome</th>
                          <th className="py-3 px-4">Objetivo</th>
                          <th className="py-3 px-4">Gasto</th>
                          <th className="py-3 px-4">Resultados</th>
                          <th className="py-3 px-4">CPR</th>
                          <th className="py-3 px-4">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800">
                        {campaigns.map(c => (
                          <tr key={c.id} className="hover:bg-gray-800/40">
                            <td className="py-3 px-4 font-semibold">{c.name}</td>
                            <td className="py-3 px-4 text-gray-300">{c.type}</td>
                            <td className="py-3 px-4 font-bold text-white">R$ {Number(c.spent).toFixed(2)}</td>
                            <td className="py-3 px-4 text-custom-mint font-bold">{c.results}</td>
                            <td className="py-3 px-4">R$ {Number(c.costPerResult).toFixed(2)}</td>
                            <td className="py-3 px-4 flex gap-2">
                              <button onClick={() => setInFlightCampaign(c)} className="bg-[#0197AF] px-2 py-1 rounded text-xs text-white hover:opacity-90">
                                ⚡ Parcial
                              </button>
                              <button onClick={() => setEditingCampaign(c)} className="bg-gray-700 px-2 py-1 rounded text-xs hover:bg-gray-600">
                                ✏️
                              </button>
                              <button onClick={() => handleDeleteCampaign(c.id)} className="bg-red-900/60 px-2 py-1 rounded text-xs text-red-300 hover:bg-red-800">
                                🗑️
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'campaigns' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold">Gestão de Campanhas Meta Ads</h2>
                </div>

                {/* Cadastrar Nova Campanha */}
                <form onSubmit={handleAddCampaign} className="bg-custom-dark border border-gray-800 rounded-xl p-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                  <h3 className="col-span-full text-lg font-bold text-custom-mint mb-2">➕ Nova Campanha</h3>
                  <input
                    type="text"
                    placeholder="Nome da Campanha"
                    value={newCampaign.name}
                    onChange={e => setNewCampaign({ ...newCampaign, name: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm"
                    required
                  />
                  <select
                    value={newCampaign.type}
                    onChange={e => setNewCampaign({ ...newCampaign, type: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm"
                  >
                    <option value="Leads">Leads</option>
                    <option value="Views">Views</option>
                    <option value="Cliques">Cliques</option>
                    <option value="Vendas de Produtos">Vendas de Produtos</option>
                    <option value="Vendas de Serviços">Vendas de Serviços</option>
                  </select>
                  <input
                    type="number"
                    placeholder="Orçamento Total (R$)"
                    value={newCampaign.budget}
                    onChange={e => setNewCampaign({ ...newCampaign, budget: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm"
                    required
                  />
                  <input
                    type="number"
                    placeholder="Valor Já Gasto (R$)"
                    value={newCampaign.spent}
                    onChange={e => setNewCampaign({ ...newCampaign, spent: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm"
                  />
                  <input
                    type="number"
                    placeholder="Resultados Obtidos"
                    value={newCampaign.results}
                    onChange={e => setNewCampaign({ ...newCampaign, results: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm"
                  />
                  <input
                    type="number"
                    placeholder="Alcance Acumulado"
                    value={newCampaign.reach}
                    onChange={e => setNewCampaign({ ...newCampaign, reach: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm"
                  />
                  <button type="submit" className="col-span-full bg-[#0197AF] hover:bg-[#01859a] py-3 rounded-lg font-bold transition">
                    Criar Campanha
                  </button>
                </form>

                {/* Cards de Campanhas */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {campaigns.map(c => (
                    <div key={c.id} className="bg-custom-dark border border-gray-800 rounded-xl p-6 relative">
                      <div className="flex justify-between items-start mb-4">
                        <div>
                          <h4 className="font-bold text-lg">{c.name}</h4>
                          <span className="text-xs bg-custom-purple px-2 py-1 rounded text-gray-200 mt-1 inline-block">{c.type}</span>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => setEditingCampaign(c)} className="text-gray-400 hover:text-white">✏️</button>
                          <button onClick={() => handleDeleteCampaign(c.id)} className="text-red-400 hover:text-red-300">🗑️</button>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4 text-sm mb-4">
                        <div>
                          <p className="text-gray-400 text-xs">Gasto / Orçamento</p>
                          <p className="font-bold">R$ {Number(c.spent).toFixed(2)} / R$ {Number(c.budget).toFixed(2)}</p>
                        </div>
                        <div>
                          <p className="text-gray-400 text-xs">Resultados / CPR</p>
                          <p className="font-bold text-custom-mint">{c.results} (R$ {Number(c.costPerResult).toFixed(2)})</p>
                        </div>
                      </div>

                      <button
                        onClick={() => setInFlightCampaign(c)}
                        className="w-full bg-gray-800 hover:bg-gray-700 text-custom-mint border border-[#00EED0]/30 py-2 rounded-lg text-sm font-semibold transition"
                      >
                        ⚡ Atualizar Dados Parciais (In-Flight)
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'crm' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold">CRM Kanban & Pipeline de Vendas</h2>
                </div>

                {/* Adicionar Lead */}
                <form onSubmit={handleAddLead} className="bg-custom-dark border border-gray-800 rounded-xl p-4 flex flex-wrap gap-4 items-center">
                  <input
                    type="text"
                    placeholder="Nome do Lead / Empresa"
                    value={newLead.name}
                    onChange={e => setNewLead({ ...newLead, name: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm flex-1 min-w-[200px]"
                    required
                  />
                  <input
                    type="text"
                    placeholder="Telefone"
                    value={newLead.phone}
                    onChange={e => setNewLead({ ...newLead, phone: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm w-40"
                  />
                  <select
                    value={newLead.campaignId}
                    onChange={e => setNewLead({ ...newLead, campaignId: e.target.value })}
                    className="bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm"
                  >
                    {campaigns.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <button type="submit" className="bg-[#0197AF] px-5 py-2.5 rounded-lg font-bold text-sm hover:bg-[#01859a]">
                    + Novo Lead
                  </button>
                </form>

                {/* Colunas do Kanban */}
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  {['Lead Gerado', 'Qualificação', 'Proposta', 'Fechamento'].map(status => {
                    const columnLeads = leads.filter(l => l.status === status);
                    return (
                      <div
                        key={status}
                        onDragOver={e => e.preventDefault()}
                        onDrop={e => {
                          const id = e.dataTransfer.getData('text/plain');
                          if (id) handleMoveLead(id, status);
                        }}
                        className="bg-custom-dark border border-gray-800 rounded-xl p-4 min-h-[500px] flex flex-col"
                      >
                        <div className="flex justify-between items-center mb-4 pb-2 border-b border-gray-800">
                          <h4 className="font-bold text-sm text-gray-200">{status}</h4>
                          <span className="bg-custom-purple px-2 py-0.5 rounded text-xs font-bold text-white">
                            {columnLeads.length}
                          </span>
                        </div>

                        <div className="space-y-3 flex-1">
                          {columnLeads.map(lead => (
                            <div
                              key={lead.id}
                              draggable
                              onDragStart={e => e.dataTransfer.setData('text/plain', lead.id)}
                              className="bg-gray-900 border border-gray-700 hover:border-[#0197AF] p-4 rounded-lg cursor-grab active:cursor-grabbing transition relative group"
                            >
                              <div className="flex justify-between items-start">
                                <h5 className="font-bold text-sm text-white">{lead.name}</h5>
                                <div className="flex gap-1 opacity-80 group-hover:opacity-100">
                                  <button onClick={() => setEditingLead(lead)} className="text-xs text-gray-400 hover:text-white">✏️</button>
                                  <button onClick={() => handleDeleteLead(lead.id)} className="text-xs text-red-400 hover:text-red-300">🗑️</button>
                                </div>
                              </div>

                              <p className="text-xs text-gray-400 mt-1">{lead.phone || lead.email || 'Sem contato'}</p>

                              {status === 'Fechamento' && (
                                <div className="mt-3 pt-2 border-t border-gray-800 flex justify-between items-center text-xs">
                                  <span className="text-custom-mint font-semibold">{lead.dealType}</span>
                                  <span className="font-bold text-white">R$ {Number(lead.dealValue).toFixed(2)}</span>
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'insights' && (
              <div className="space-y-6">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">✨</span>
                  <h2 className="text-2xl font-bold">Gemini AI Insights</h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-custom-dark border border-[#0197AF]/40 rounded-xl p-6 space-y-4">
                    <h3 className="font-bold text-lg text-custom-mint">Diagnóstico de Saúde do Funil</h3>
                    <div className="space-y-3 text-sm text-gray-300">
                      <p>• <strong>Custo Por Resultado:</strong> O CPR médio atual está em <span className="text-white font-bold">R$ {avgCostPerResult.toFixed(2)}</span>.</p>
                      <p>• <strong>ROAS Geral:</strong> Retorno atual de <span className="text-custom-mint font-bold">R$ {roasPerReal.toFixed(2)}</span> a cada R$ 1,00 investido.</p>
                      <p>• <strong>Conversão Comercial:</strong> {crmConversionRate > 20 ? 'Excelente taxa de conversão!' : 'Atenção: Aumente o acompanhamento de propostas em aberto no Kanban.'}</p>
                    </div>
                  </div>

                  <div className="bg-custom-dark border border-[#4B227A] rounded-xl p-6 space-y-4">
                    <h3 className="font-bold text-lg text-purple-300">Recomendações Estratégicas Gemini</h3>
                    <ul className="space-y-2 text-sm text-gray-300 list-disc list-inside">
                      <li>Otimize os criativos das campanhas com CPR acima da média.</li>
                      <li>Reforce abordagens no WhatsApp para leads parados na fase de Qualificação.</li>
                      <li>Realoque orçamento para a campanha de maior retorno em vendas diretas.</li>
                    </ul>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* MODAL: ATUALIZAÇÃO PARCIAL IN-FLIGHT */}
          {inFlightCampaign && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleUpdateInFlight} className="bg-custom-dark border border-gray-700 rounded-xl p-6 w-full max-w-md space-y-4">
                <h3 className="font-bold text-lg text-custom-mint">⚡ Atualizar Métricas (In-Flight)</h3>
                <p className="text-xs text-gray-400">{inFlightCampaign.name}</p>

                <div>
                  <label className="text-xs text-gray-300">Orçamento Já Consumido (R$)</label>
                  <input
                    type="number"
                    value={inFlightCampaign.spent}
                    onChange={e => setInFlightCampaign({ ...inFlightCampaign, spent: e.target.value })}
                    className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm mt-1"
                    required
                  />
                </div>

                <div>
                  <label className="text-xs text-gray-300">Resultados Parciais Obtidos</label>
                  <input
                    type="number"
                    value={inFlightCampaign.results}
                    onChange={e => setInFlightCampaign({ ...inFlightCampaign, results: e.target.value })}
                    className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm mt-1"
                    required
                  />
                </div>

                <div>
                  <label className="text-xs text-gray-300">Alcance Acumulado</label>
                  <input
                    type="number"
                    value={inFlightCampaign.reach}
                    onChange={e => setInFlightCampaign({ ...inFlightCampaign, reach: e.target.value })}
                    className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm mt-1"
                  />
                </div>

                <div className="flex justify-end gap-3 pt-2">
                  <button type="button" onClick={() => setInFlightCampaign(null)} className="px-4 py-2 text-sm text-gray-400">Cancelar</button>
                  <button type="submit" className="bg-[#0197AF] px-4 py-2 rounded text-sm font-bold">Salvar Atualização</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: CONFIRMAR FECHAMENTO DE LEAD */}
          {closingLeadModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleConfirmClosing} className="bg-custom-dark border border-gray-700 rounded-xl p-6 w-full max-w-md space-y-4">
                <h3 className="font-bold text-lg text-custom-mint">🎉 Registrar Fechamento de Venda</h3>
                <p className="text-xs text-gray-400">Lead: {closingLeadModal.name}</p>

                <div>
                  <label className="text-xs text-gray-300">Tipo de Venda</label>
                  <select
                    value={closingData.dealType}
                    onChange={e => setClosingData({ ...closingData, dealType: e.target.value })}
                    className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm mt-1"
                  >
                    <option value="Produto">Produto</option>
                    <option value="Serviço">Serviço</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs text-gray-300">Valor Total da Venda (R$)</label>
                  <input
                    type="number"
                    value={closingData.dealValue}
                    onChange={e => setClosingData({ ...closingData, dealValue: e.target.value })}
                    className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm mt-1"
                    placeholder="Ex: 2500"
                    required
                  />
                </div>

                <div className="flex justify-end gap-3 pt-2">
                  <button type="button" onClick={() => setClosingLeadModal(null)} className="px-4 py-2 text-sm text-gray-400">Cancelar</button>
                  <button type="submit" className="bg-[#0197AF] px-4 py-2 rounded text-sm font-bold">Confirmar Venda</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: EDITAR LEAD */}
          {editingLead && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleSaveEditLead} className="bg-custom-dark border border-gray-700 rounded-xl p-6 w-full max-w-md space-y-4">
                <h3 className="font-bold text-lg text-custom-mint">✏️ Editar Lead</h3>
                <input
                  type="text"
                  value={editingLead.name}
                  onChange={e => setEditingLead({ ...editingLead, name: e.target.value })}
                  className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm"
                  required
                />
                <input
                  type="text"
                  value={editingLead.phone || ''}
                  onChange={e => setEditingLead({ ...editingLead, phone: e.target.value })}
                  className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm"
                  placeholder="Telefone"
                />
                <select
                  value={editingLead.status}
                  onChange={e => setEditingLead({ ...editingLead, status: e.target.value })}
                  className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm"
                >
                  <option value="Lead Gerado">Lead Gerado</option>
                  <option value="Qualificação">Qualificação</option>
                  <option value="Proposta">Proposta</option>
                  <option value="Fechamento">Fechamento</option>
                </select>
                <div className="flex justify-end gap-3">
                  <button type="button" onClick={() => setEditingLead(null)} className="px-4 py-2 text-sm text-gray-400">Cancelar</button>
                  <button type="submit" className="bg-[#0197AF] px-4 py-2 rounded text-sm font-bold">Salvar Alterações</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: EDITAR CAMPANHA */}
          {editingCampaign && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleSaveEditCampaign} className="bg-custom-dark border border-gray-700 rounded-xl p-6 w-full max-w-md space-y-4">
                <h3 className="font-bold text-lg text-custom-mint">✏️ Editar Campanha</h3>
                <input
                  type="text"
                  value={editingCampaign.name}
                  onChange={e => setEditingCampaign({ ...editingCampaign, name: e.target.value })}
                  className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm"
                  required
                />
                <input
                  type="number"
                  value={editingCampaign.budget}
                  onChange={e => setEditingCampaign({ ...editingCampaign, budget: e.target.value })}
                  className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm"
                  placeholder="Orçamento Total"
                  required
                />
                <div className="flex justify-end gap-3">
                  <button type="button" onClick={() => setEditingCampaign(null)} className="px-4 py-2 text-sm text-gray-400">Cancelar</button>
                  <button type="submit" className="bg-[#0197AF] px-4 py-2 rounded text-sm font-bold">Salvar Alterações</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
